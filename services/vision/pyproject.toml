[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vorg-vision"
version = "0.7.0"
description = "Virtual Org Phase 7 vision pipeline: YOLOX (Apache-2.0) on onnxruntime (MIT), CPU only"
requires-python = ">=3.12"
license = { text = "Proprietary (project code); dependencies Apache-2.0 / MIT / BSD only, see ADR-67" }
dependencies = [
    "numpy>=2.0",                     # BSD-3-Clause
    "opencv-python-headless>=4.10",   # Apache-2.0
    "onnxruntime>=1.20",              # MIT
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
vorg-vision = "vorg_vision.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
