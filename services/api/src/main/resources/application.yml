server:
  port: 8080

spring:
  application:
    name: virtual-organization-api
  jackson:
    property-naming-strategy: SNAKE_CASE
    datatype:
      datetime:
        write-dates-as-timestamps: false
    # Jackson 3 defaults to ISO-8601 strings in UTC.
  mvc:
    problemdetails:
      enabled: true
  datasource:
    # Runtime connection: non-superuser vo_app, subject to forced RLS (ADR-28).
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: vo_app
    password: ${VO_APP_DB_PASSWORD}
  flyway:
    # Migrations run as the owner role, never as vo_app (ADR-28).
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    placeholders:
      app_password: ${VO_APP_DB_PASSWORD}
      outbox_password: ${VO_OUTBOX_DB_PASSWORD}
      sim_password: ${VO_SIM_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${VO_TRACING_SAMPLING:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Export only when an OTLP endpoint is provided.
          enabled: ${VO_OTLP_TRACING_ENABLED:false}
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

vo:
  security:
    # /actuator/prometheus is unauthenticated only where this is true (local). Production must protect it.
    permit-prometheus: false
