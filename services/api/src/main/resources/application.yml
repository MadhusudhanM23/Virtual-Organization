server:
  port: 8080

spring:
  application:
    name: virtual-organization-api
  jackson:
    property-naming-strategy: SNAKE_CASE
    datatype:
      datetime:
        write-dates-as-timestamps: false
    # Jackson 3 defaults to ISO-8601 strings in UTC.
  mvc:
    problemdetails:
      enabled: true
  datasource:
    # Runtime connection: non-superuser vo_app, subject to forced RLS (ADR-28).
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    username: vo_app
    password: ${VO_APP_DB_PASSWORD}
  flyway:
    # Migrations run as the owner role, never as vo_app (ADR-28).
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    placeholders:
      app_password: ${VO_APP_DB_PASSWORD}
      outbox_password: ${VO_OUTBOX_DB_PASSWORD}
      sim_password: ${VO_SIM_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  tracing:
    sampling:
      probability: ${VO_TRACING_SAMPLING:0.1}
  opentelemetry:
    tracing:
      export:
        otlp:
          # Export only when an OTLP endpoint is provided.
          enabled: ${VO_OTLP_TRACING_ENABLED:false}
          endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}/v1/traces

logging:
  structured:
    format:
      console: ecs
  level:
    root: INFO

vo:
  security:
    # /actuator/prometheus is unauthenticated only where this is true (local). Production must protect it.
    permit-prometheus: false
  jwt:
    # RS256 signing key (PEM, PKCS#8). Must be provisioned in non-local environments; never committed (*.pem ignored).
    key-path: ${VO_JWT_KEY_PATH:}
    generate-if-absent: false
    issuer: ${VO_JWT_ISSUER:http://localhost:8080}
  auth:
    # Refresh cookie Secure attribute: true everywhere except local development over plain http.
    cookie-secure: true
  demo:
    # Shared password for SYNTHETIC demo users (DemoSeeder; local/demo/test profiles only). Never commit a real value.
    user-password: ${DEMO_USER_PASSWORD:}
  events:
    # Events with occurred_at older than this are still accepted but flagged (MDC late_event, vo_events_late_total).
    late-skew: PT5M
    partitions:
      days-ahead: 7
      cron: "0 15 * * * *"
  sim:
    # Scenarios/simulation-runs connection: vo_sim (NOBYPASSRLS, sim schema only; REQ-074 isolation, Plan 6.3).
    datasource:
      url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      username: vo_sim
      password: ${VO_SIM_DB_PASSWORD}
  outbox:
    # Publisher connection: vo_outbox (BYPASSRLS, evt schema only); never the runtime vo_app pool.
    datasource:
      url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      username: vo_outbox
      password: ${VO_OUTBOX_DB_PASSWORD}
    poller:
      enabled: true
    poll-interval: 200ms
    batch-size: 50
    max-attempts: 8
    backoff-base: PT1S
    backoff-max: PT5M
  recommendations:
    # Plan 8.3, ADR-63. Every generator value is required (no defaults in code).
    generator:
      # ASSUMPTION: plan minutes per simulated adapter batch (the simulated TMS runs compressed time; ADR-63).
      minutes-per-batch: 30
      # ASSUMPTION: objective minutes charged per moved trip (no cost data for a dock change exists).
      reassignment-penalty-min: 15
      max-solve-ms: 10000
      random-seed: 20261012
      solver-threads: 2
      solver-queue: 4
    verification:
      # SIM-TMS batches (15 s each in the live loop) within which every target must show its new dock.
      timeout-batches: 2
