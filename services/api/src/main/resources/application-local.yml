# Local profile: dev placeholders only (never real secrets). Keep in sync with .env.example (Plan 1.1).
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:virtual_org}
    password: ${VO_APP_DB_PASSWORD:vo_app_dev_password}
  flyway:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:virtual_org}
    user: ${POSTGRES_USER:vo_owner}
    password: ${POSTGRES_PASSWORD:vo_owner_dev_password}
    placeholders:
      app_password: ${VO_APP_DB_PASSWORD:vo_app_dev_password}
      outbox_password: ${VO_OUTBOX_DB_PASSWORD:vo_outbox_dev_password}
      sim_password: ${VO_SIM_DB_PASSWORD:vo_sim_dev_password}

management:
  tracing:
    sampling:
      probability: 1.0

vo:
  security:
    permit-prometheus: true
  jwt:
    key-path: ${VO_JWT_KEY_PATH:./secrets/dev-jwt.pem}
    generate-if-absent: true
  auth:
    cookie-secure: false
  sim:
    datasource:
      url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:virtual_org}
      password: ${VO_SIM_DB_PASSWORD:vo_sim_dev_password}
  outbox:
    datasource:
      url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:virtual_org}
      password: ${VO_OUTBOX_DB_PASSWORD:vo_outbox_dev_password}
  # Live (simulated) operations for the demo tenant's Bengaluru site: SIM-WMS/SIM-TMS sync every 15 s and the movement
  # source ticking every second (see LiveProperties for the rate-control settings). Off in every other profile.
  live:
    enabled: true
    tenant-id: 018f0000-0000-7000-8000-00000000a001
    site-id: 018f0000-0000-7000-8000-00000000a021
    operator-actor-ref: 018f0000-0000-7000-8000-00000000a104
  # Replay snapshots of every site with a world model (ADR-44): every 5 minutes, kept 7 days; first one 30 s after start.
  replay:
    snapshots:
      enabled: true
      interval: 5m
      initial-delay: 30s
      retention: 7d
  integration:
    simulated:
      # Every 12th batch carries one deliberately invalid inventory record to demonstrate data-quality findings.
      fault-every: 12
