name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java:
    name: java (build + tests, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Maven verify
        run: ./mvnw -B verify

  web:
    name: web (lint, typecheck, test, build, contracts)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (includes packages/contracts)
        run: npm test
      - name: Build
        run: npm run build

  operator-pwa:
    name: operator-pwa (Playwright, offline/online, 390px axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/operator-pwa
      - name: E2E (builds the PWA, serves it on port 5210, API mocked)
        run: npm run e2e
        working-directory: apps/operator-pwa

  ai:
    name: ai (services/ai pytest + ruff, tests/ai-eval with the offline provider)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e "services/ai[dev]"
      - name: Ruff (services/ai)
        run: ruff check src tests
        working-directory: services/ai
      - name: Ruff (tests/ai-eval)
        run: ruff check tests/ai-eval
      - name: Unit tests
        run: pytest services/ai
      - name: Eval suite (offline; never needs OPENAI_API_KEY)
        run: python tests/ai-eval/run_eval.py
